<text x="1292.00" y="126.00" text-anchor="start" font-size="12" font-weight="700" fill="#22282c" >Plinth</text>
<text x="1648.00" y="126.00" text-anchor="end" font-size="12" font-weight="500" fill="#5c6a72" >grey stone, 2'-0"</text>
<text x="1292.00" y="148.00" text-anchor="start" font-size="12" font-weight="700" fill="#22282c" >Walls</text>
<text x="1648.00" y="148.00" text-anchor="end" font-size="12" font-weight="500" fill="#5c6a72" >warm white</text>
<text x="1292.00" y="170.00" text-anchor="start" font-size="12" font-weight="700" fill="#22282c" >Sill band</text>
<text x="1648.00" y="170.00" text-anchor="end" font-size="12" font-weight="500" fill="#5c6a72" >sandstone</text>
<text x="1292.00" y="192.00" text-anchor="start" font-size="12" font-weight="700" fill="#22282c" >Hall windows</text>
<text x="1648.00" y="192.00" text-anchor="end" font-size="12" font-weight="500" fill="#5c6a72" >split by the column</text>
<text x="1292.00" y="214.00" text-anchor="start" font-size="12" font-weight="700" fill="#22282c" >Door</text>
<text x="1648.00" y="214.00" text-anchor="end" font-size="12" font-weight="500" fill="#5c6a72" >teak, 3'-6" × 7'-0"</text>
<text x="1292.00" y="236.00" text-anchor="start" font-size="12" font-weight="700" fill="#22282c" >Chajja</text>
<text x="1648.00" y="236.00" text-anchor="end" font-size="12" font-weight="500" fill="#5c6a72" >2 ft deep at the lintel</text>
<text x="1292.00" y="258.00" text-anchor="start" font-size="12" font-weight="700" fill="#22282c" >Parapet</text>
<text x="1648.00" y="258.00" text-anchor="end" font-size="12" font-weight="500" fill="#5c6a72" >3'-0", with a coping</text>
<text x="1292.00" y="280.00" text-anchor="start" font-size="12" font-weight="700" fill="#22282c" >Porch posts</text>
<text x="1648.00" y="280.00" text-anchor="end" font-size="12" font-weight="500" fill="#5c6a72" >at 23 ft and 31 ft</text>
<rect x="1280.00" y="306.00" width="380.00" height="26.00" fill="#8f4d38" stroke="none" stroke-width="1" />
<text x="1292.00" y="324.00" text-anchor="start" font-size="12" font-weight="700" fill="#fffaf6" >NOTES</text>
<rect x="1280.00" y="332.00" width="380.00" height="266.00" fill="#fffdfb" stroke="#e4ddd4" stroke-width="0.8" />
<text x="1292.00" y="350.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >North elevation of the ground floor,</text>
<text x="1292.00" y="368.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >as it is built now.</text>
<text x="1292.00" y="386.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >Dashed lines are the future floor.</text>
<text x="1292.00" y="404.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >They rise from this roof slab.</text>
<text x="1292.00" y="422.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >The parapet comes off when that</text>
<text x="1292.00" y="440.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >floor is added.</text>
<text x="1292.00" y="458.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >The left bay stays on the front wall.</text>
<text x="1292.00" y="476.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >The hall bay becomes a balcony</text>
<text x="1292.00" y="494.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >set back 4 ft.</text>
<text x="1292.00" y="512.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >The chajja is the line the upper</text>
<text x="1292.00" y="530.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >floor builds on.</text>
<text x="1292.00" y="548.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >A licensed structural engineer must</text>
<text x="1292.00" y="566.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >confirm footings, columns, and the</text>
<text x="1292.00" y="584.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >staircase before construction.</text>
