<text x="992.00" y="478.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >North is the road. The 40 ft side is the frontage. Depth is 50 ft.</text>
<text x="992.00" y="496.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >The gate, the path, and the main door share one line, east of center.</text>
<text x="992.00" y="514.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >The 5 ft front yard holds the steps, two planters, and a scooter.</text>
<text x="992.00" y="532.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >A car does not fit in this front setback.</text>
<text x="992.00" y="550.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >Coverage is about 71 percent. If the local rule caps coverage</text>
<text x="992.00" y="568.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >near 60 to 65 percent, the footprint has to shrink.</text>
<text x="992.00" y="586.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >Setbacks vary by town. Confirm them before the footings are dug.</text>
<text x="992.00" y="604.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >A licensed structural engineer must confirm footings, columns,</text>
<text x="992.00" y="622.00" text-anchor="start" font-size="11.5" font-weight="500" fill="#22282c" >and the staircase before construction.</text>
